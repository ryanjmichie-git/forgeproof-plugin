name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Single source of truth for the test-suite path (renamed in one place if the
# skill directory moves).
env:
  FP_TESTS: skills/run/scripts/test_forgeproof.py

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest ${{ env.FP_TESTS }} -v

  # Windows engine-CLI coverage under both shells a user can realistically
  # spawn Python from. Hooks and skills never execute under cmd.exe (Claude
  # Code uses Git Bash or PowerShell), but the engine CLI itself must work
  # when invoked from either.
  test-windows-shells:
    name: pytest (windows, git-bash + cmd)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: pytest from Git Bash
        shell: bash
        run: python -m pytest "${FP_TESTS}" -v
      - name: pytest from cmd.exe
        shell: cmd
        run: python -m pytest %FP_TESTS% -v

  # Minimal Linux: python3 exists, `python` does not. This is the environment
  # where the v1.0.1 PR gate failed open (exit 2 -> || -> exit 127); the suite
  # must pass with no `python` symlink present.
  test-python3-only:
    name: pytest (debian, python3 only)
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - name: Install python3 + openssh-client (no python symlink)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pytest openssh-client git ca-certificates
      - uses: actions/checkout@v4
      - name: Assert `python` is absent
        run: |
          if command -v python; then
            echo "'python' exists in this container; the python3-only scenario is not being tested" >&2
            exit 1
          fi
      - run: python3 -m pytest "${FP_TESTS}" -v

  # The v1.3.0 ROADMAP criterion, proven mechanically on every push: the
  # emitted attestation verifies via cosign with NO ForgeProof code in the
  # verification path. Both binaries from the recorded interop contract run
  # (the installer action is pinned by commit SHA and the cosign BINARY
  # version is pinned exactly), so upstream cannot break this build without a
  # deliberate pin-bump PR. Artifact cases pass the artifact PATH so cosign
  # hashes each file itself — feeding the attestation's own digest back is
  # vacuous for tamper detection (docs/cosign-interop.md) — and the one
  # --digest case recomputes its digest from the on-disk file. cosign appears
  # in this job ONLY: baseline verification is stdlib-only by principle, and
  # it must never appear in preflight.
  cosign-interop:
    name: cosign interop (${{ matrix.cosign }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cosign: ["v2.6.5", "v3.1.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: ${{ matrix.cosign }}
      - name: Build one real attested bundle with the actual engine
        shell: bash
        run: |
          set -euo pipefail
          cosign version
          python stress/make_bundle.py "$RUNNER_TEMP/interop" > "$RUNNER_TEMP/bundle.json"
          cat "$RUNNER_TEMP/bundle.json"
      - name: "Positive: every artifact subject verifies, cosign hashing the files itself"
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/bundle.json"
          PEM=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['pem'])" "$B")
          ATT=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['attestation'])" "$B")
          python -c "import json,sys;print('\n'.join(json.load(open(sys.argv[1]))['artifacts']))" "$B" | tr -d '\r' |
          while read -r f; do
            cosign verify-blob-attestation --key "$PEM" --bundle "$ATT" \
              --type slsaprovenance1 --insecure-ignore-tlog "$f"
          done
          # The --digest form too — with a digest recomputed from the ON-DISK
          # file, never copied out of the attestation.
          F0=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['artifacts'][0])" "$B")
          D0=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$F0")
          cosign verify-blob-attestation --key "$PEM" --bundle "$ATT" \
            --type slsaprovenance1 --insecure-ignore-tlog --digest "$D0" --digestAlg sha256
      - name: "Negative: flipped artifact byte must fail the claim check"
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/bundle.json"
          PEM=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['pem'])" "$B")
          ATT=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['attestation'])" "$B")
          F0=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['artifacts'][0])" "$B")
          python -c "import sys;p=sys.argv[1];d=bytearray(open(p,'rb').read());d[0]^=255;open(p,'wb').write(bytes(d))" "$F0"
          if cosign verify-blob-attestation --key "$PEM" --bundle "$ATT" \
               --type slsaprovenance1 --insecure-ignore-tlog "$F0"; then
            echo "tampered artifact verified green — the claim check is vacuous" >&2
            exit 1
          fi
          python -c "import sys;p=sys.argv[1];d=bytearray(open(p,'rb').read());d[0]^=255;open(p,'wb').write(bytes(d))" "$F0"
      - name: "Negative: flipped envelope payload byte must fail the signature check"
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/bundle.json"
          PEM=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['pem'])" "$B")
          ATT=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['attestation'])" "$B")
          F0=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['artifacts'][0])" "$B")
          python -c "import base64,json,sys;p=sys.argv[1];a=json.load(open(p));pl=bytearray(base64.b64decode(a['dsseEnvelope']['payload']));pl[10]^=1;a['dsseEnvelope']['payload']=base64.b64encode(bytes(pl)).decode();open(p,'w',newline='').write(json.dumps(a,sort_keys=True,separators=(',',':')))" "$ATT"
          if cosign verify-blob-attestation --key "$PEM" --bundle "$ATT" \
               --type slsaprovenance1 --insecure-ignore-tlog "$F0"; then
            echo "tampered envelope verified green — the signature check is broken" >&2
            exit 1
          fi

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      # Always validate the plugin manifest explicitly: validating the repo
      # root would trigger marketplace mode (.claude-plugin/marketplace.json).
      # (--strict is documented but not implemented on current CLI 2.1.x;
      # add it back once `claude plugin validate --help` lists it.)
      - run: claude plugin validate .claude-plugin/plugin.json
